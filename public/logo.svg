<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradient for the main shape -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Chat bubble shape - main -->
  <path d="M160 180 
           C160 156 180 136 204 136 
           H308 
           C332 136 352 156 352 180 
           V260 
           C352 284 332 304 308 304 
           H240 
           L200 344 
           V304 
           H204 
           C180 304 160 284 160 260 
           Z" 
        fill="white" 
        filter="url(#glow)"/>
  
  <!-- AI brain/circuit pattern inside bubble -->
  <circle cx="220" cy="210" r="12" fill="url(#mainGradient)"/>
  <circle cx="256" cy="210" r="12" fill="url(#mainGradient)"/>
  <circle cx="292" cy="210" r="12" fill="url(#mainGradient)"/>
  
  <!-- Connecting lines (neural network style) -->
  <path d="M232 210 H244 M268 210 H280" stroke="url(#mainGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Sound wave / voice lines -->
  <path d="M210 250 Q220 240 230 250 Q240 260 250 250 Q260 240 270 250 Q280 260 290 250 Q300 240 310 250" 
        stroke="url(#mainGradient)" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Sparkle accents -->
  <g fill="white" opacity="0.9">
    <path d="M380 140 L385 150 L395 150 L387 157 L390 168 L380 161 L370 168 L373 157 L365 150 L375 150 Z"/>
    <circle cx="140" cy="340" r="6"/>
    <circle cx="390" cy="320" r="4"/>
    <circle cx="130" cy="170" r="5"/>
  </g>
  
  <!-- Letter 'A' stylized accent -->
  <text x="256" y="395" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle" 
        opacity="0.95">alsom</text>
</svg>